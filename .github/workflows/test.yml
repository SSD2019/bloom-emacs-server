name: ERT Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: 29.4
      - name: Run ERT tests
        run: emacs --batch -Q -L . -l ert -l bloom-server -l bloom-server-test -f ert-run-tests-batch-and-exit
